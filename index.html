<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>현장 작업기록 데모</title>
<style>
@font-face{font-family:SUIT;src:url(https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:SUIT,Pretendard,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;-webkit-appearance:none;appearance:none}
textarea{-webkit-user-select:text;user-select:text}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

#cam,#scene{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#scene{background:radial-gradient(ellipse 55% 30% at 28% 30%,rgba(150,140,120,.55),transparent 70%),radial-gradient(ellipse 45% 35% at 78% 55%,rgba(80,100,120,.6),transparent 70%),radial-gradient(ellipse 90% 30% at 50% 92%,rgba(90,80,70,.7),transparent 70%),linear-gradient(180deg,#33373c,#202326 45%,#2d2824)}
#app{position:fixed;left:0;right:0;top:0;height:100%;z-index:1;--bottom:calc(env(safe-area-inset-bottom,0px) + max(28px,8vh))}

.hdr{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;display:flex;justify-content:space-between;z-index:12}
.cbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--lineSoft);background:var(--bg);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.cbtn.on{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.cbtn.ring{border-color:var(--accent)}
.cbtn.dimmed{opacity:.3;pointer-events:none}
.hdr.top{z-index:25}

.menuScrim{position:absolute;inset:0;border:0;background:var(--menuScrim);z-index:10}
.menu{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:16px;width:232px;padding:8px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:4px;z-index:11}
.mi{height:56px;border-radius:16px;border:0;background:transparent;font-size:15px;font-weight:700;text-align:left;padding:0 10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.mi .ic{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mi small{font-size:12px;font-weight:600;color:var(--muted)}
.mi:disabled{color:var(--menuFg);cursor:not-allowed}
.mi:disabled .ic{opacity:.6}

.page{position:absolute;inset:0;z-index:30;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:24px;overflow-y:auto}
.pageHead{display:flex;align-items:center;gap:14px}
.pageHead h2{margin:0;font-size:20px;font-weight:800}
.sec{display:flex;flex-direction:column;gap:10px}
.sec .lb{font-size:13px;font-weight:700;color:var(--muted);padding:0 4px}
.themeOpt{height:68px;border-radius:34px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:14px;padding:0 20px 0 12px;font-size:16px;font-weight:700;cursor:pointer}
.themeOpt.sel{border:2px solid var(--accent)}
.themeOpt .sw{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.themeOpt .sw i{width:18px;height:18px;border-radius:50%}
.themeOpt .sw svg{width:22px;height:22px}
.themeOpt .radio{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.themeOpt.sel .radio{border-color:var(--accent)}
.themeOpt.sel .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}

.notice{position:absolute;top:calc(env(safe-area-inset-top,0px) + 72px);left:16px;right:16px;padding:10px 8px 10px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;gap:12px;z-index:6}
.notice .ic{width:40px;height:40px;flex-shrink:0;border-radius:50%;background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center}
.notice .tx{flex:1;min-width:0}
.notice b{display:block;font-size:14px}
.notice span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{height:44px;padding:0 16px;flex-shrink:0;border-radius:22px;border:0;background:var(--accent);color:var(--onAccent);font-size:13px;font-weight:800;white-space:nowrap}

.center{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 76px);bottom:calc(var(--bottom) + 138px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:2;--avail:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 76px - max(28px,8vh) - 138px);--extra:0px}
@supports (height:100dvh){.center{--avail:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 76px - max(28px,8vh) - 138px)}}
.center>*{flex-shrink:0}
.center.rearm{--extra:66px}
.center.withNotice{--avail2:60px}
.center.withNotice{top:calc(env(safe-area-inset-top,0px) + 136px)}
.above{position:relative;z-index:1}
.strip{width:min(300px,84vw);padding:12px 16px;border-radius:26px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:12px}
.strip .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0}
.strip .t{flex:1;min-width:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .n{flex-shrink:0;font-size:18px;font-weight:800;color:var(--dimLabel)}
.modes{display:flex;gap:14px}
.mode{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.mode.sel{border:3px solid var(--accent);color:var(--text)}

.vf{position:relative;z-index:0;display:block;width:min(320px,86vw);height:112px;border-radius:18px;border:1px solid var(--camLine);background:transparent;box-shadow:0 0 0 200vmax var(--dimColor);padding:0;overflow:hidden;transition:width .25s,height .25s}
.vf.qr{--s:min(300px,78vw,calc(var(--avail) - 64px - var(--extra) - var(--avail2,0px)));width:var(--s);height:var(--s);border-radius:24px}
.vf .aim{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;opacity:.85}
.vf .aim::before,.vf .aim::after{content:"";position:absolute;background:#F2F4F6;border-radius:1px}
.vf .aim::before{left:8px;top:0;width:2px;height:18px}
.vf .aim::after{top:8px;left:0;width:18px;height:2px}
.stripX{width:36px;height:36px;border-radius:50%;border:1px solid var(--lineSoft);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;margin-right:-6px}
.vf.ok{border-color:var(--accent)}
.vf .c{position:absolute;width:24px;height:24px;border:0 solid var(--corner)}
.vf.qr .c{width:36px;height:36px}
.vf .tl{top:12px;left:12px;border-top-width:3px;border-left-width:3px;border-top-left-radius:9px}
.vf .tr{top:12px;right:12px;border-top-width:3px;border-right-width:3px;border-top-right-radius:9px}
.vf .bl{bottom:12px;left:12px;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:9px}
.vf .br{bottom:12px;right:12px;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:9px}
.vf .line{position:absolute;left:24px;right:24px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 14px 3px var(--glow);animation:sweep 1.6s ease-in-out infinite alternate}
.vf .line{will-change:top}
@keyframes sweep{from{top:12%}to{top:84%}}
.vf .flash{position:absolute;inset:0;background:var(--glowSoft)}
.vf .check{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center;box-shadow:0 0 36px var(--glow)}
.vf.qr .check{width:88px;height:88px;margin:-44px 0 0 -44px}
.vf .guide{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);white-space:nowrap;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.14);color:#E9ECEF;font-size:12px;font-weight:600}
.vf.qr .guide{bottom:20px}
.vf .guide.err{border-color:#FF8A6B;color:#FF8A6B}

.run{display:flex;flex-direction:column;align-items:center;width:100%}
.runBox{display:inline-flex;flex-direction:column;align-items:stretch;max-width:92vw}
.runHead{display:flex;align-items:baseline;gap:12px;width:100%;min-width:0;contain:inline-size}
.runHead .h{flex-shrink:0;font-size:32px;font-weight:800;letter-spacing:-.01em;line-height:1.15;white-space:nowrap}
.runHead .s{min-width:0;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{flex-shrink:0;align-self:center;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:700}
.timer{margin-top:10px;font-size:clamp(52px,18vw,72px);font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--accent);text-shadow:0 0 26px var(--glow);white-space:nowrap}
.ctl{display:flex;gap:28px;margin-top:40px}
.ctl button{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.memoLine{margin-top:22px;max-width:300px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.memoLine span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--bottom) + 196px);height:52px;padding:0 18px;border-radius:26px;background:var(--surface2);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;z-index:5}

.cats{position:absolute;left:0;right:0;bottom:var(--bottom);display:flex;justify-content:center;gap:22px;z-index:4}
.cat{width:96px;display:flex;flex-direction:column;align-items:center;gap:8px}
.cat .well{height:96px;display:flex;align-items:center;justify-content:center}
.cat button{width:60px;height:60px;border-radius:50%;border:0;padding:0;background:var(--surface2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;transition:all .25s ease}
.cat button svg{width:24px;height:24px}
.cat label{font-size:13px;font-weight:600;color:var(--muted)}
.cat.armed button{width:84px;height:84px;background:var(--accent);color:var(--onAccent);box-shadow:0 0 0 6px var(--glowSoft),0 0 32px var(--glow)}
.cat.running button{width:84px;height:84px;background:var(--dim);color:var(--onDim);box-shadow:none}
.cat.armed button svg,.cat.running button svg{width:34px;height:34px}
.cat.armed label{color:var(--accent);font-weight:800}
.cat.running label{color:var(--dimLabel);font-weight:800}

.sheetWrap{position:absolute;inset:0}
.sheetWrap .scrim{position:absolute;inset:0;border:0;background:var(--scrim);z-index:20}
.center.memoMode{top:calc(env(safe-area-inset-top,0px) + 64px);bottom:calc(var(--sheetH,0px) + 8px);z-index:21}
.memoMode .ctl,.memoMode .memoLine{display:none}
.memoMode .runHead .h{font-size:24px}
.memoMode .timer{font-size:48px;margin-top:6px}
.sheet{z-index:22;position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow-y:auto;padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 24px);border-radius:26px 26px 0 0;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line);flex-shrink:0}
.sheet.split{max-height:88vh;max-height:88dvh;overflow:hidden;padding-bottom:0;gap:10px}
.sheetHead{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sheetHead .cbtn{width:44px;height:44px;border-color:var(--line);background:var(--surface)}
.sheetBody{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:16px;margin:0 -20px;padding:6px 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
.sheet h3{margin:0;font-size:20px;font-weight:800}
.opt{height:60px;border-radius:30px;border:1px solid var(--line);background:var(--surface2);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0}
.ghost{height:52px;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:700;flex-shrink:0}
textarea{height:96px;resize:none;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-family:inherit;font-size:16px;line-height:1.5;outline:none;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:14px;font-weight:700}
.chips button.sel{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.row2{display:flex;gap:10px;flex-shrink:0}
.row2 button{height:56px;border-radius:28px;font-size:16px;font-weight:700}
.btnOut{flex:1;border:1px solid var(--line);background:var(--surface)}
.btnFill{flex:2;border:0;background:var(--accent);color:var(--onAccent);font-weight:800!important}
.kv{border:1px solid var(--line);border-radius:18px;overflow:hidden;flex-shrink:0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted);flex-shrink:0}
.kv span:last-child{font-weight:700;text-align:right}
.orders{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.orders .cap{font-size:13px;font-weight:700;color:var(--muted)}
.order{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:16px;border:1px solid var(--line)}
.order .l{flex:1;min-width:0;display:flex;flex-direction:column}
.order .l b{font-size:14px}
.order .l span{font-size:12px;color:var(--muted)}
.order .q{font-size:13px;font-weight:700}
.memoBox{display:flex;gap:8px;font-size:14px;padding:12px 16px;border-radius:16px;background:var(--surface2);flex-shrink:0}
.memoBox span:first-child{color:var(--muted);flex-shrink:0}
.day{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:18px;background:var(--surface2);flex-shrink:0}
.day .top{display:flex;justify-content:space-between;align-items:baseline}
.day .top b{font-size:14px}
.day .top span{font-size:13px;color:var(--muted)}
.barWrap{position:relative}
.barWrap.over{padding-bottom:16px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.mark{position:absolute;top:-4px;width:2px;height:22px;margin-left:-1px;border-radius:1px;background:var(--text)}
.markTx{position:absolute;top:20px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--muted)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend span{color:var(--muted)}
.legend b{margin-left:auto}
.full{height:56px;border-radius:28px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:700;flex-shrink:0}

/* v0.2 멀티: 스캔 화면은 틀을 위로 올리고, 분류 버튼 위에 싱글/멀티 버튼을 둔다 */
.center.scan{justify-content:flex-start;padding-top:20px;bottom:calc(var(--bottom) + 196px)}
.vf.lock{border-color:var(--accent)}
.vf .mtag{position:absolute;left:44px;top:15px;font-size:12px;font-weight:800;letter-spacing:.04em;color:#E9ECEF;white-space:nowrap}
.modebar{position:absolute;left:0;right:0;bottom:calc(var(--bottom) + 132px);display:flex;justify-content:center;gap:16px;z-index:4}
.modeBtn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.modeBtn svg{width:24px;height:24px}
.modeBtn.sel{border:3px solid var(--accent);color:var(--text)}
.modeBtn.go{border:0;background:var(--accent);color:var(--onAccent);box-shadow:0 0 0 5px var(--glowSoft)}
.modeBtn.off{opacity:.35;pointer-events:none}
.cat.off{opacity:.3;pointer-events:none}
.basket{width:min(320px,86vw);flex-shrink:1!important;min-height:0;display:flex;flex-direction:column;border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:6px}
.blist{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;max-height:252px;display:flex;flex-direction:column;gap:4px}
.brow{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 12px;border-radius:14px;background:var(--surface2);flex-shrink:0}
.brow .t{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brow .t b{flex-shrink:0;font-size:14px}
.brow .t span{min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.brow .n{flex-shrink:0;font-size:12px;font-weight:700;color:var(--muted)}
.brow .x{width:36px;height:36px;flex-shrink:0;border-radius:50%;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.brow .x svg{width:18px;height:18px}
.dlgWrap{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.dlgWrap .scrim{position:absolute;inset:0;border:0;background:var(--scrim)}
.dlg{position:relative;width:min(320px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px 18px 16px;display:flex;flex-direction:column;gap:20px}
.dlg p{margin:0;text-align:center;font-size:17px;font-weight:800;line-height:1.4}
.dlg p small{display:block;margin-top:6px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subT{font-size:13px;font-weight:700;color:var(--muted);margin-left:8px}
.jcard{border:1px solid var(--line);border-radius:18px;overflow:hidden;flex-shrink:0}
.jh{width:100%;min-height:54px;border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px;text-align:left}
.jh .jt{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.jh .jt b{flex-shrink:0;font-size:15px}
.jh .jt span{min-width:0;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.jh .jn{flex-shrink:0;font-size:12px;font-weight:700;color:var(--muted)}
.jh .jc{flex-shrink:0;font-size:13px;font-weight:800}
.jh .chev{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .2s}
.jh .chev.up{transform:rotate(180deg)}
.jb{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:12px;background:var(--surface2)}
.jmeta{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;font-size:13px;font-weight:700;color:var(--muted)}
.jmeta b{margin-left:4px;font-size:15px;font-weight:800;color:var(--text)}
.jb .order{background:var(--surface)}
.ver{margin-top:auto;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay hidden></video>
<div id="scene" hidden></div>
<div id="app"></div>

<script>
(function () {

      case 'theme': applyTheme(v); render(); break;
      case 'torch': S.torch = !S.torch; applyTorch(); render(); break;
      case 'memo':
        if (S.sheet === 'memo') { S.sheet = null; render(); break; }
        S.sheet = 'memo'; S.menu = false; S.memo = S.run && S.run.memo ? S.run.memo : ''; render(); break;
      /* 카메라 없이 볼 때: 싱글은 틀을 누르면 바로 인식, 멀티는 틀을 누르면 다음 데모 바코드가 잡힌 상태가 된다 */
      case 'demoScan':
        if (S.pmode === 'multi') { S.err = null; setLock(CODES[S.demoIdx++ % CODES.length]); }
        else scanned(CODES[S.demoIdx++ % CODES.length]);
        break;
      case 'closeScanner': if (S.run) { S.screen = 'running'; resetScan(); render(); } break;
      case 'cat': tapCat(v); break;
      case 'pmode': tapMode(v); break;
      case 'askRemove': ask('remove', +v); break;
      case 'askStop': ask('stop'); break;
      case 'confirmYes': answer(true); break;
      case 'confirmNo': answer(false); break;
      case 'fold':
        var single = S.run && S.run.jobs && S.run.jobs.length === 1 && !S.run.multi;
        var cur = S.open[v] !== undefined ? S.open[v] : single;
        S.open[v] = !cur; render(); break;
      case 'prefMode': PREF.mode = v; savePref(); if (S.screen === 'ready' && !S.basket.length) { S.pmode = v; S.lock = null; } render(); break;
      case 'prefCenter': PREF.center = v; savePref(); if (S.screen === 'ready' && !S.basket.length) S.armed = v; render(); break;
      case 'detail': S.sheet = 'detail'; S.menu = false; render(); break;
      case 'closeSheet': S.sheet = null; render(); break;
      case 'nonprod': startRun({ cat: 'nonprod', item: v, ship: null, req: null, orders: [] }); break;
      case 'chip':
        S.memo = v;
        var mta = document.getElementById('memo');
        if (mta) {
          mta.value = v;
          app.querySelectorAll('.chips button').forEach(function (cb) { cb.classList.toggle('sel', cb.dataset.v === v); });
        } else render();
        break;
      case 'saveMemo': if (document.activeElement) document.activeElement.blur(); if (S.run) { S.run.memo = S.memo.trim(); save(); } S.sheet = null; toast('메모가 저장되었습니다'); break;
      case 'resume': if (S.lastJob) startRun(S.lastJob); break;
    }
  });

  /* ---------- clock: timers + lunch auto-close (12:00) ---------- */
  setInterval(function () {
    if (S.run) {
      var noon = new Date(); noon.setHours(12, 0, 0, 0);
      var now = Date.now();
      if (S.run.start < noon.getTime() && now >= noon.getTime() && now < noon.getTime() + HR) {
        var job = Object.assign({}, S.run); delete job.start; delete job.memo;
        closeRun(noon.getTime()); S.lastJob = job; S.run = null; S.notice = 'lunch'; S.screen = 'ready'; S.sheet = null;
        save(); render(); return;
      }
    }
    var t = fmt(elapsed());
    app.querySelectorAll('[data-timer]').forEach(function (el) { el.textContent = t; });
  }, 1000);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopCamera(); else render();
  });

  render();
})();
</script>
</body>
</html>

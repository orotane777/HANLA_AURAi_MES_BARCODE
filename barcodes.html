<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데모 바코드</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
@font-face{font-family:SUIT;src:url(https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
body{margin:0;background:#F2F3EF;color:#14171A;font-family:SUIT,Pretendard,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;padding:32px 16px 48px}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:24px;font-weight:800}
.lead{margin:4px 0 0;font-size:14px;color:#5A6169}
.card{background:#fff;border:1px solid #D2D6CF;border-radius:20px;padding:20px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;align-items:center;break-inside:avoid}
.info{grid-column:1 / -1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.info b{font-size:22px;font-weight:800}
.info span{font-size:15px;color:#5A6169}
.info em{font-style:normal;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#E8EAE5}
.bc svg{width:100%;height:auto;max-width:520px;display:block}
.qr{width:150px;height:150px}
.qr svg{width:100%;height:100%;display:block}
.cap{font-size:12px;color:#5A6169;margin-top:6px}
@media (max-width:640px){.card{grid-template-columns:1fr}.qr{width:170px;height:170px;justify-self:center}}
@media print{body{background:#fff;padding:0}.card{border-color:#999}}
</style>
</head>
<body>
<main>
<div>
<h1>데모 바코드</h1>
<p class="lead">모두 가짜 번호다. 폰에서 작업기록 데모를 열고 호선작업 바코드 창으로 아래 바코드나 QR을 찍으면 그 작업이 시작된다.</p>
</div>
<div id="cards"></div>
</main>
<script>
var JOBS = [
  { code: '202609280042', ship: 'H2861', item: 'Automation assembly', n: 1 },
  { code: '202609280051', ship: 'H2874', item: 'Local control cabinet', n: 3 },
  { code: '202609280063', ship: 'H2890', item: 'Junction box', n: 1 }
];
var box = document.getElementById('cards');
box.style.display = 'flex'; box.style.flexDirection = 'column'; box.style.gap = '20px';
JOBS.forEach(function (j) {
  var card = document.createElement('section');
  card.className = 'card';
  card.innerHTML = '<div class="info"><b>' + j.ship + '</b><span>' + j.item + '</span><em>작업지시 ' + j.n + '건</em></div>' +
    '<div><div class="bc"><svg></svg></div><div class="cap">바코드 · 요청번호 ' + j.code + '</div></div>' +
    '<div><div class="qr"></div><div class="cap" style="text-align:center">QR</div></div>';
  box.appendChild(card);
  JsBarcode(card.querySelector('.bc svg'), j.code, { format: 'CODE128', width: 3, height: 110, margin: 16, displayValue: false, background: '#ffffff', lineColor: '#000000' });
  var qr = qrcode(0, 'M'); qr.addData(j.code); qr.make();
  card.querySelector('.qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 3, scalable: true });
});
</script>
</body>
</html>
